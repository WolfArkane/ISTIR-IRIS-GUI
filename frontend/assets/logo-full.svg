        <path class="petal-alt" d="M0,0 C 8,-46 30,-84 0,-122 C -30,-84 -8,-46 0,0 Z" transform="rotate(45)"/>
        <path class="petal" d="M0,0 C 8,-46 30,-84 0,-122 C -30,-84 -8,-46 0,0 Z" transform="rotate(90)"/>
        <path class="petal-alt" d="M0,0 C 8,-46 30,-84 0,-122 C -30,-84 -8,-46 0,0 Z" transform="rotate(135)"/>
        <path class="petal" d="M0,0 C 8,-46 30,-84 0,-122 C -30,-84 -8,-46 0,0 Z" transform="rotate(180)"/>
