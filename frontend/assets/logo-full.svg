<svg width="360" height="440" viewBox="0 0 360 440" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="badgeClip2"><circle cx="180" cy="150" r="130"/></clipPath>
