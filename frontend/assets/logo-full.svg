    .label { fill: #12294A; font-family: sans-serif; font-weight: 500; letter-spacing: 2px; }
    .sub { fill: #5B7CA0; font-family: sans-serif; }
  </style>

  <circle cx="180" cy="150" r="132" fill="#0E1E36"/>
  <circle cx="180" cy="150" r="130" fill="#173B63"/>

  <g clip-path="url(#badgeClip2)">
